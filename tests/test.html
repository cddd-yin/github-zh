<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自动化测试 · GitHub 中文化</title>
<style>
  :root { color-scheme: light; }
  body { font: 14px/1.7 "Segoe UI", "Microsoft YaHei", "Noto Sans", sans-serif; max-width: 900px; margin: 24px auto; padding: 0 16px; color: #1f2328; }
  h1 { font-size: 20px; margin-bottom: 4px; }
  p.lead { color: #57606a; margin-top: 0; }
  #summary { font-size: 16px; font-weight: 600; padding: 10px 14px; border-radius: 8px; background: #f6f8fa; border: 1px solid #d0d7de; margin: 14px 0; }
  #summary.pass { background: #dafbe1; border-color: #aceebb; color: #1a7f37; }
  #summary.fail { background: #ffebe9; border-color: #ff818266; color: #cf222e; }
  ol { padding-left: 26px; }
  li { margin: 2px 0; }
  li.pass .badge { color: #1a7f37; }
  li.fail .badge { color: #cf222e; }
  .badge { display: inline-block; min-width: 42px; font-weight: 700; font-size: 12px; margin-right: 6px; }
  .detail { color: #57606a; font-size: 12px; word-break: break-all; }
  code { background: #f6f8fa; border-radius: 4px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>GitHub 中文化 · 自动化测试</h1>
<p class="lead">页面加载后自动运行；结果同时写入控制台变量 <code>window.__ghzhTest</code>，便于自动化读取。</p>
<div id="summary">运行中…</div>
<ol id="results" data-ghzh-skip></ol>

<!-- 被测脚本（与发布版是同一个文件） -->
<script src="../GitHub-中文化.user.js"></script>

<script>
(function () {
  'use strict';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ready(cb) {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', function () {
        /* 等用户脚本完成初始化（它先注册 DOMContentLoaded，先执行） */
        requestAnimationFrame(function () { setTimeout(cb, 50); });
      });
    } else {
      cb();
    }
  }

  ready(run);

  function run() {
    var g = window.__ghzh;
    if (!g) {
      renderError('未找到 window.__ghzh，用户脚本未成功加载。');
      return;
    }

    var results = [];
    var passed = 0;

    function test(name, fn) {
      try {
        fn();
        results.push({ name: name, ok: true });
        passed++;
      } catch (e) {
        results.push({ name: name, ok: false, detail: (e && e.message) || String(e) });
      }
    }

    function assertEq(actual, expected) {
      if (actual !== expected) {
        throw new Error('实际 ' + JSON.stringify(actual) + ' ≠ 期望 ' + JSON.stringify(expected));
      }
    }

    function sandbox(html) {
      var box = document.createElement('div');
      box.innerHTML = html;
      return box;
    }
    function translated(html) {
      var box = sandbox(html);
      g.translateRoot(box);
      return box;
    }
    function textOf(html) {
      return translated(html).textContent.trim();
    }

    /* ============ A. 词库精确匹配 ============ */
    test('词库：Issues → 议题', function () {
      assertEq(textOf('<span>Issues</span>'), '议题');
    });
    test('词库：大小写不敏感（ISSUES）', function () {
      assertEq(textOf('<span>ISSUES</span>'), '议题');
    });
    test('词库：忽略并保留首尾空白', function () {
      assertEq(translated('<span>  Sign in  </span>').textContent, '  登录  ');
    });
    test('词库：Pull Requests → 拉取请求', function () {
      assertEq(textOf('<a>Pull Requests</a>'), '拉取请求');
    });
    test('词库：commit → 提交', function () {
      assertEq(textOf('<span>commit</span>'), '提交');
    });
    test('不翻译：整句不做部分替换', function () {
      assertEq(textOf('<p>Commit your changes before you pull.</p>'), 'Commit your changes before you pull.');
    });
    test('不翻译：正文句子不被命中', function () {
      assertEq(textOf('<p>Issues are tracked here.</p>'), 'Issues are tracked here.');
    });

    /* ============ B. 动态句式 ============ */
    test('动态：48,917 Commits → 48,917 个提交', function () {
      assertEq(textOf('<span>48,917 Commits</span>'), '48,917 个提交');
    });
    test('动态：1 Commit → 1 个提交', function () {
      assertEq(textOf('<span>1 Commit</span>'), '1 个提交');
    });
    test('动态：分支领先提示', function () {
      assertEq(textOf('<p>This branch is 3 commits ahead of main.</p>'), '此分支领先 main 3 个提交。');
    });
    test('动态：3 commits ahead', function () {
      assertEq(textOf('<span>3 commits ahead</span>'), '领先 3 个提交');
    });
    test('动态：Commits on Oct 5, 2026', function () {
      assertEq(textOf('<div>Commits on Oct 5, 2026</div>'), '提交于 2026年10月5日');
    });
    test('动态：Updated 2 days ago', function () {
      assertEq(textOf('<div>Updated 2 days ago</div>'), '更新于 2 天前');
    });
    test('动态：1,234 Stars → 1,234 个星标', function () {
      assertEq(textOf('<span>1,234 Stars</span>'), '1,234 个星标');
    });

    /* ============ B2. v1.2.0 新增 ============ */
    test('动态：33 minutes ago → 33 分钟前', function () {
      assertEq(textOf('<span>33 minutes ago</span>'), '33 分钟前');
    });
    test('动态：an hour ago → 1 小时前', function () {
      assertEq(textOf('<span>an hour ago</span>'), '1 小时前');
    });
    test('动态：just now → 刚刚', function () {
      assertEq(textOf('<span>just now</span>'), '刚刚');
    });
    test('动态：1,234 followers → 1,234 位关注者', function () {
      assertEq(textOf('<span>1,234 followers</span>'), '1,234 位关注者');
    });
    test('动态：1,234 contributions in the last year', function () {
      assertEq(textOf('<span>1,234 contributions in the last year</span>'), '1,234 次贡献（过去一年）');
    });
    test('词库：Agents → 智能体', function () {
      assertEq(textOf('<a>Agents</a>'), '智能体');
    });
    test('词库：Security and quality → 安全与质量', function () {
      assertEq(textOf('<a>Security and quality</a>'), '安全与质量');
    });
    test('词库：Branch → 分支（修复 1 Branch 残留）', function () {
      assertEq(textOf('<span>Branch</span>'), '分支');
    });
    test('词库：Convert to draft → 转为草稿', function () {
      assertEq(textOf('<button>Convert to draft</button>'), '转为草稿');
    });
    test('动态：仓库已归档整句', function () {
      assertEq(
        textOf('<div>This repository has been archived by the owner on Oct 5, 2026. It is now read-only.</div>'),
        '此仓库已被所有者于 2026年10月5日 归档，现在是只读状态。'
      );
    });
    test('词库：Download raw file → 下载原始文件', function () {
      assertEq(textOf('<button>Download raw file</button>'), '下载原始文件');
    });
    test('词库：yesterday → 昨天', function () {
      assertEq(textOf('<span>yesterday</span>'), '昨天');
    });

    /* ============ B3. v1.3.0 新增：个人主页 ============ */
    test('词库：Block or report user → 屏蔽或举报用户', function () {
      assertEq(textOf('<button>Block or report user</button>'), '屏蔽或举报用户');
    });
    test('动态：Block or report maboloshi', function () {
      assertEq(textOf('<span>Block or report maboloshi</span>'), '屏蔽或举报 maboloshi');
    });
    test('词库：Popular repositories → 热门仓库', function () {
      assertEq(textOf('<h2>Popular repositories</h2>'), '热门仓库');
    });
    test('动态：无公开仓库提示', function () {
      assertEq(textOf('<p>cddd-yin doesn\u2019t have any public repositories yet.</p>'), 'cddd-yin 还没有公开仓库。');
    });
    test('动态：登录态空状态提示', function () {
      assertEq(textOf('<p>You don\u2019t have any public repositories yet.</p>'), '你还没有公开仓库。');
      assertEq(textOf('<p>You don\u2019t have any activity yet for this period.</p>'), '你在此时间段内还没有动态。');
    });
    test('动态：1 contribution in the last year（单数修复）', function () {
      assertEq(textOf('<span>1 contribution in the last year</span>'), '1 次贡献（过去一年）');
    });
    test('词库：月份 October → 10月；Oct 3 → 10月3日', function () {
      assertEq(textOf('<span>October</span>'), '10月');
      assertEq(textOf('<span>Oct 3</span>'), '10月3日');
    });
    test('词库：星期 Sunday → 周日', function () {
      assertEq(textOf('<span>Sunday</span>'), '周日');
      assertEq(textOf('<span>Wed</span>'), '周三');
    });
    test('动态：October 2026 → 2026年10月', function () {
      assertEq(textOf('<button>October 2026</button>'), '2026年10月');
    });
    test('动态：完整日期 October 5, 2026 → 2026年10月5日', function () {
      assertEq(textOf('<span>October 5, 2026</span>'), '2026年10月5日');
    });
    test('动态：带星期日期（Sunday, October 5, 2026）', function () {
      assertEq(textOf('<span>Sunday, October 5, 2026</span>'), '2026年10月5日（周日）');
    });
    test('词库：贡献图标签（Contribution Graph / Day of Week / Less）', function () {
      assertEq(textOf('<span>Contribution Graph</span>'), '贡献图');
      assertEq(textOf('<span>Day of Week</span>'), '星期');
      assertEq(textOf('<span>Less</span>'), '少');
    });
    test('词库：贡献等级说明', function () {
      assertEq(textOf('<span>No contributions.</span>'), '无贡献。');
      assertEq(textOf('<span>Medium-high contributions.</span>'), '中高贡献。');
    });
    test('词库：Show more activity / Activity overview', function () {
      assertEq(textOf('<button>Show more activity</button>'), '显示更多动态');
      assertEq(textOf('<h2>Activity overview</h2>'), '动态概览');
    });
    test('动态：活动句 Created 42 commits in 4 repositories', function () {
      assertEq(textOf('<span>Created 42 commits in 4 repositories</span>'), '在 4 个仓库中创建了 42 个提交');
    });
    test('动态：活动句 Opened 2 pull requests in 1 repository', function () {
      assertEq(textOf('<span>Opened 2 pull requests in 1 repository</span>'), '在 1 个仓库中开启了 2 个拉取请求');
    });
    test('动态：活动句 Created 1 repository', function () {
      assertEq(textOf('<span>Created 1 repository</span>'), '创建了 1 个仓库');
    });
    test('动态：and 24 other repositories', function () {
      assertEq(textOf('<a>and 24 other repositories</a>'), '以及其他 24 个仓库');
    });
    test('动态：This contribution was made on Oct 3', function () {
      assertEq(textOf('<span>This contribution was made on Oct 3</span>'), '此贡献发生于 10月3日');
    });
    test('动态：提交占比句（58% of commits in October …）', function () {
      assertEq(
        textOf('<div>58% of commits in October were made to maboloshi/scoop-private</div>'),
        '10月有 58% 的提交提交至 maboloshi/scoop-private'
      );
    });
    test('动态：Contribution activity in 2026, 1 of 13', function () {
      assertEq(textOf('<a>Contribution activity in 2026, 1 of 13</a>'), '2026年贡献动态（1/13）');
    });
    test('不翻译：活动规则不误伤未知名词（Created 2 files）', function () {
      assertEq(textOf('<span>Created 2 files</span>'), 'Created 2 files');
    });
    test('词库：Expand / Collapse / README', function () {
      assertEq(textOf('<button>Expand</button>'), '展开');
      assertEq(textOf('<button>Collapse</button>'), '折叠');
      assertEq(textOf('<span>README</span>'), '自述文件');
    });
    test('属性：Achievement: Starstruck → 成就：Starstruck', function () {
      var box = translated('<img alt="Achievement: Starstruck">');
      assertEq(box.firstElementChild.getAttribute('alt'), '成就：Starstruck');
    });
    test('属性：查看完整头像', function () {
      var box = translated('<img alt="View maboloshi\u2019s full-sized avatar">');
      assertEq(box.firstElementChild.getAttribute('alt'), '查看 maboloshi 的完整头像');
    });
    test('属性：Footer 导航 aria-label', function () {
      var box = translated('<nav aria-label="Footer"></nav>');
      assertEq(box.firstElementChild.getAttribute('aria-label'), '页脚');
    });
    test('词库：页脚（Community / Contact）', function () {
      assertEq(textOf('<a>Community</a>'), '社区');
      assertEq(textOf('<a>Contact</a>'), '联系');
    });
    test('影子 DOM：relative-time 内的相对时间（2 days ago → 2 天前）', function () {
      var box = document.createElement('div');
      var host = document.createElement('relative-time');
      var sr = host.attachShadow({ mode: 'open' });
      sr.textContent = '2 days ago';
      box.appendChild(host);
      g.translateRoot(box);
      assertEq(sr.textContent.trim(), '2 天前');
    });
    test('影子 DOM：yesterday（组件的另一种文案）', function () {
      var box = document.createElement('div');
      var host = document.createElement('relative-time');
      var sr = host.attachShadow({ mode: 'open' });
      sr.textContent = 'yesterday';
      box.appendChild(host);
      g.translateRoot(box);
      assertEq(sr.textContent.trim(), '昨天');
    });
    test('动态：+ 519 releases / + 3,832 contributors', function () {
      assertEq(textOf('<a>+ 519 releases</a>'), '+ 519 个发行版');
      assertEq(textOf('<span>+ 3,832 contributors</span>'), '+ 3,832 位贡献者');
    });
    test('词库：Folders and files / Last commit message / Last commit date', function () {
      assertEq(textOf('<th>Folders and files</th>'), '文件夹与文件');
      assertEq(textOf('<th>Last commit message</th>'), '最近提交信息');
      assertEq(textOf('<th>Last commit date</th>'), '最近提交日期');
    });
    test('词库：Code of conduct / Contributing / Latest', function () {
      assertEq(textOf('<a>Code of conduct</a>'), '行为准则');
      assertEq(textOf('<a>Contributing</a>'), '贡献指南');
      assertEq(textOf('<span>Latest</span>'), '最新');
    });
    test('动态与属性：commits by / Sponsor / starred', function () {
      assertEq(textOf('<span>commits by araujogui</span>'), 'araujogui 的提交');
      assertEq(textOf('<a aria-label="Sponsor @nodejs"></a>'), '');
      var box = translated('<a aria-label="Sponsor @nodejs"></a>');
      assertEq(box.firstElementChild.getAttribute('aria-label'), '赞助 @nodejs');
      var box2 = translated('<button aria-label="122,383 users starred this repository"></button>');
      assertEq(box2.firstElementChild.getAttribute('aria-label'), '122,383 位用户星标了此仓库');
    });

    /* ============ C. 跳过区域（不误伤） ============ */
    test('跳过：行内代码 code', function () {
      assertEq(textOf('<p><code>Commit</code></p>'), 'Commit');
    });
    test('跳过：代码块 pre', function () {
      assertEq(textOf('<pre>Star</pre>'), 'Star');
    });
    test('跳过：README 正文 .markdown-body', function () {
      assertEq(textOf('<div class="markdown-body"><p>Issues</p></div>'), 'Issues');
    });
    test('跳过：文件名链接 /blob/', function () {
      assertEq(textOf('<a href="/o/r/blob/main/Settings">Settings</a>'), 'Settings');
    });
    test('跳过：目录链接 /tree/', function () {
      assertEq(textOf('<a href="/o/r/tree/main/Settings">Settings</a>'), 'Settings');
    });
    test('跳过：议题标题链接', function () {
      assertEq(textOf('<a data-testid="issue-listitem-title-link">Commit</a>'), 'Commit');
    });
    test('跳过：用户名 .user-mention', function () {
      assertEq(textOf('<span class="user-mention">Star</span>'), 'Star');
    });
    test('跳过：筛选框包装层', function () {
      assertEq(textOf('<div class="FilterInputWrapper"><span>Issues</span></div>'), 'Issues');
    });
    test('跳过：自定义 data-ghzh-skip', function () {
      assertEq(textOf('<div data-ghzh-skip><span>Sign in</span></div>'), 'Sign in');
    });
    test('跳过：textarea 文本', function () {
      assertEq(textOf('<textarea>Star</textarea>'), 'Star');
    });

    /* ============ D. 属性翻译 ============ */
    test('属性：按钮 title', function () {
      var box = translated('<button title="Star this repository"></button>');
      assertEq(box.firstElementChild.getAttribute('title'), '星标本仓库');
    });
    test('属性：输入框 placeholder（v1.1.0 修复）', function () {
      var box = translated('<input placeholder="Search GitHub">');
      assertEq(box.firstElementChild.getAttribute('placeholder'), '搜索 GitHub');
    });
    test('属性：无障碍 aria-label', function () {
      var box = translated('<button aria-label="Open global navigation menu"></button>');
      assertEq(box.firstElementChild.getAttribute('aria-label'), '打开全局导航菜单');
    });
    test('跳过：正文内图片 alt 不翻译', function () {
      var box = translated('<div class="markdown-body"><img alt="Issues"></div>');
      assertEq(box.firstElementChild.firstElementChild.getAttribute('alt'), 'Issues');
    });

    /* ============ E. 幂等与开关 ============ */
    test('幂等：重复翻译不叠加', function () {
      var box = translated('<span>Issues</span>');
      g.translateRoot(box);
      assertEq(box.textContent.trim(), '议题');
    });
    test('开关：关闭还原英文、开启恢复中文', function () {
      var box = document.createElement('div');
      box.innerHTML = '<span>Sign in</span>';
      document.body.appendChild(box);
      try {
        g.translateRoot(box);
        assertEq(box.textContent.trim(), '登录');
        g.setEnabled(false, true);
        assertEq(box.textContent.trim(), 'Sign in');
      } finally {
        g.setEnabled(true, true);
        box.remove();
      }
      assertEq(box.textContent.trim(), '登录');
    });

    /* ============ F. 标签页标题 ============ */
    test('标题：Sign in to GitHub · GitHub', function () {
      var old = document.title;
      try {
        document.title = 'Sign in to GitHub · GitHub';
        g.translateTitle();
        assertEq(document.title, '登录 GitHub · GitHub');
      } finally {
        document.title = old;
      }
    });

    try { localStorage.removeItem('ghzh:enabled'); } catch (e) {}

    render(results, passed);
  }

  function render(results, passed) {
    var failed = results.length - passed;
    var summary = document.getElementById('summary');
    var list = document.getElementById('results');

    summary.textContent = failed === 0
      ? '✅ 全部通过：' + passed + ' / ' + results.length
      : '❌ 失败 ' + failed + ' 项；通过 ' + passed + ' / ' + results.length;
    summary.className = failed === 0 ? 'pass' : 'fail';

    results.forEach(function (r) {
      var li = document.createElement('li');
      li.className = r.ok ? 'pass' : 'fail';
      li.innerHTML = '<span class="badge">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
        escapeHtml(r.name) +
        (r.ok ? '' : '<div class="detail">' + escapeHtml(r.detail) + '</div>');
      list.appendChild(li);
    });

    window.__ghzhTest = {
      total: results.length,
      passed: passed,
      failed: failed,
      results: results,
    };
    console.log('[ghzh-test] ' + passed + '/' + results.length + ' 通过' + (failed ? '，' + failed + ' 失败' : ''));
  }

  function renderError(msg) {
    var summary = document.getElementById('summary');
    summary.textContent = '❌ ' + msg;
    summary.className = 'fail';
    window.__ghzhTest = { total: 0, passed: 0, failed: 1, results: [{ name: msg, ok: false, detail: msg }] };
  }
})();
</script>
</body>
</html>
